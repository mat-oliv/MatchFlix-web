# Stack de desenvolvimento com hot reload (tsx watch + vite dev server).
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# É um arquivo completo, não um override — rode um OU outro, nunca os dois juntos.

name: movie-match

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moviematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviematch}
      POSTGRES_DB: ${POSTGRES_DB:-moviematch}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moviematch} -d ${POSTGRES_DB:-moviematch}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moviematch}:${POSTGRES_PASSWORD:-moviematch}@db:5432/${POSTGRES_DB:-moviematch}?schema=public
      # Sem pgbouncer aqui: mesma conexão para migrations e aplicação. O schema exige
      # a variável de qualquer forma (ver prisma/schema.prisma).
      DIRECT_URL: postgresql://${POSTGRES_USER:-moviematch}:${POSTGRES_PASSWORD:-moviematch}@db:5432/${POSTGRES_DB:-moviematch}?schema=public
      TMDB_API_KEY: ${TMDB_API_KEY:?defina TMDB_API_KEY no arquivo .env da raiz}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no arquivo .env da raiz}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: "3333"
    command: sh -c "npx prisma db push --skip-generate && npm run dev"
    volumes:
      - ./backend:/app
      # Volume anônimo: preserva o node_modules do container (engines Linux do
      # Prisma) em vez de deixar o node_modules do macOS sobrescrever pelo mount.
      - /app/node_modules
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-3333}}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
